<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Markers - Космічна гра</title>
    <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        
        #aladin-lite-div {
            width: 100vw;
            height: 100vh;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        
        .top-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px 25px;
            pointer-events: auto;
            max-width: 900px;
            width: 90%;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .game-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .player-info {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .controls-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .space-selector {
            display: flex;
            gap: 5px;
        }
        
        .space-btn {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .space-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .space-btn.active {
            background: #3B82F6;
            border-color: #3B82F6;
        }
        
        .layer-selector {
            display: flex;
            gap: 5px;
        }
        
        .layer-btn {
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .layer-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        
        .layer-btn.active {
            background: rgba(147, 51, 234, 0.3);
            border-color: #9333EA;
            color: white;
        }
        
        .color-palette {
            display: flex;
            gap: 8px;
        }
        
        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.15);
        }
        
        .color-btn.active {
            border-color: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .marker-form {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 30px;
            pointer-events: auto;
            max-width: 450px;
            width: 90%;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .marker-form.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        
        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            opacity: 0.8;
        }
        
        .form-input, .form-textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        
        .form-input:focus, .form-textarea:focus {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn-primary {
            background: #3B82F6;
            color: white;
        }
        
        .btn-secondary {
            background: #6B7280;
            color: white;
        }
        
        .bottom-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px 25px;
            pointer-events: auto;
            max-width: 800px;
            width: 90%;
        }
        
        .markers-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 0;
        }
        
        .marker-item {
            flex-shrink: 0;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .marker-item:hover {
            transform: translateY(-2px);
        }
        
        .info-message {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59, 130, 246, 0.95);
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        
        .info-message.active {
            display: block;
        }
        
        .game-mode {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(147, 51, 234, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: auto;
            font-size: 14px;
            font-weight: bold;
        }
        
        .animate-btn {
            padding: 8px 15px;
            background: linear-gradient(45deg, #FF4444, #FF44FF);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .animate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 68, 255, 0.4);
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0;
                transform: translate(-50%, -45%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }
        
        @keyframes slideDown {
            from { 
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="aladin-lite-div"></div>
    
    <div class="ui-overlay">
        <div class="top-panel">
            <div class="game-header">
                <div>
                    <div class="game-title">🌌 Space Markers Explorer</div>
                    <div class="player-info">
                        Гравець: <span id="playerName">...</span> | 
                        Маркерів зібрано: <span id="markerCount">0</span> |
                        Режим: <span id="currentMode">Небо</span>
                    </div>
                </div>
                <div class="color-palette" id="colorPalette">
                    <!-- Colors will be added by JS -->
                </div>
            </div>
            <div class="controls-row">
                <div class="space-selector">
                    <button class="space-btn active" onclick="switchToSky()">🌟 Небо</button>
                    <button class="space-btn" onclick="switchToMars()">🔴 Марс</button>
                    <button class="space-btn" onclick="switchToMoon()">🌙 Місяць</button>
                </div>
                <div class="layer-selector">
                    <button class="layer-btn" onclick="switchLayer('optical')">Оптичний</button>
                    <button class="layer-btn" onclick="switchLayer('infrared')">Інфрачервоний</button>
                    <button class="layer-btn" onclick="switchLayer('xray')">Рентген</button>
                </div>
                <button class="animate-btn" onclick="startTour()">🚀 Тур</button>
            </div>
        </div>
        
        <div class="game-mode" id="gameMode" style="display: none;">
            🎮 Режим пошуку скарбів
        </div>
        
        <div class="marker-form" id="markerForm">
            <div class="form-title">Додати маркер на <span id="formLocation">небо</span></div>
            <div class="form-group">
                <label class="form-label">Назва маркера</label>
                <input type="text" class="form-input" id="markerName" placeholder="Моя знахідка...">
            </div>
            <div class="form-group">
                <label class="form-label">Деталі (опціонально)</label>
                <textarea class="form-textarea" id="markerDetails" rows="3" placeholder="Опис знахідки..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Координати</label>
                <div style="opacity: 0.6; font-size: 12px;">
                    RA: <span id="coordRA">0</span>, Dec: <span id="coordDec">0</span>
                </div>
            </div>
            <div class="form-buttons">
                <button class="btn btn-primary" onclick="addMarker()">Додати</button>
                <button class="btn btn-secondary" onclick="closeMarkerForm()">Скасувати</button>
            </div>
        </div>
        
        <div class="info-message" id="infoMessage"></div>
        
        <div class="bottom-panel">
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 10px;">Ваші маркери:</div>
            <div class="markers-list" id="markersList">
                <!-- Markers will be added here -->
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const colors = [
            { name: "Червоний", value: "#FF4444" },
            { name: "Синій", value: "#4444FF" },
            { name: "Зелений", value: "#44FF44" },
            { name: "Жовтий", value: "#FFFF44" },
            { name: "Фіолетовий", value: "#FF44FF" },
            { name: "Блакитний", value: "#44FFFF" },
            { name: "Помаранчевий", value: "#FFA500" },
            { name: "Рожевий", value: "#FF69B4" },
        ];
        
        const surveys = {
            optical: 'P/DSS2/color',
            infrared: 'P/2MASS/color',
            xray: 'P/XMM/PN/color',
            mars: 'CDS/P/Mars/Viking-MDIM21-color',
            moon: 'CDS/P/Moon/Clementine-LROC-WAC-LRO',
        };
        
        const marsLocations = [
            {ra: 226.2, dec: 18.65, name: 'Olympus Mons'},
            {ra: 70.5, dec: -42.4, name: 'Hellas Planitia'},
            {ra: 250.4, dec: 40.5, name: 'Alba Mons'},
            {ra: -59.2, dec: -13.9, name: 'Valles Marineris'},
            {ra: 147.21, dec: 25.02, name: 'Elysium Mons'},
            {ra: 316.0, dec: -49.7, name: 'Argyre Basin'},
        ];
        
        const skyObjects = [
            {target: 'M31', name: 'Галактика Андромеди'},
            {target: 'M42', name: 'Туманність Оріона'},
            {target: 'M45', name: 'Плеяди'},
            {target: 'M13', name: 'Скупчення Геркулеса'},
            {target: 'M51', name: 'Галактика Вихор'},
            {target: 'M57', name: 'Туманність Кільце'},
        ];
        
        // State
        let aladin = null;
        let userId = localStorage.getItem('userId') || crypto.randomUUID();
        let userName = localStorage.getItem('userName') || '';
        let selectedColor = colors[0].value;
        let markers = JSON.parse(localStorage.getItem('markers') || '[]');
        let currentCoords = { ra: 0, dec: 0 };
        let ws = null;
        let allPlayersMarkers = [];
        let currentMode = 'sky';
        let currentLayer = 'optical';
        let tourIndex = 0;
        let tourInterval = null;
        
        // Save userId
        localStorage.setItem('userId', userId);
        
        // Initialize
        function init() {
            // Get or set username
            if (!userName) {
                userName = prompt('Введіть ваше ім\'я:') || 'Космонавт';
                localStorage.setItem('userName', userName);
            }
            
            document.getElementById('playerName').textContent = userName;
            updateMarkerCount();
            
            // Initialize color palette
            const palette = document.getElementById('colorPalette');
            colors.forEach((color, index) => {
                const btn = document.createElement('button');
                btn.className = 'color-btn' + (index === 0 ? ' active' : '');
                btn.style.backgroundColor = color.value;
                btn.title = color.name;
                btn.onclick = () => selectColor(color.value, btn);
                palette.appendChild(btn);
            });
            
            // Initialize Aladin
            A.init.then(() => {
                aladin = A.aladin('#aladin-lite-div', {
                    survey: surveys.optical,
                    fov: 60,
                    target: 'Orion',
                    showReticle: true,
                    showCooGrid: false,
                    showFrame: false,
                    showFullscreenControl: true,
                    showLayersControl: false,
                    showGotoControl: true,
                    showZoomControl: true,
                    showShareControl: false,
                    showCatalog: true,
                    projection: 'SIN',
                    cooFrame: 'equatorial'
                });
                
                // Add click handler
                aladin.on('click', (object) => {
                    if (!object) {
                        // Clicked on sky/mars/moon
                        const coords = aladin.getRaDec();
                        currentCoords = { ra: coords[0], dec: coords[1] };
                        openMarkerForm();
                    } else if (object.data && object.data.markerId) {
                        // Clicked on marker
                        handleMarkerClick(object.data.markerId);
                    }
                });
                
                // Add position change handler
                aladin.on('positionChanged', (ra, dec) => {
                    // Could show current position
                });
                
                // Load existing markers
                loadMarkers();
                
                // Connect WebSocket
                connectWebSocket();
            });
        }
        
        function selectColor(color, button) {
            selectedColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            button.classList.add('active');
        }
        
        function switchToSky() {
            if (!aladin) return;
            currentMode = 'sky';
            document.getElementById('currentMode').textContent = 'Небо';
            document.getElementById('formLocation').textContent = 'небо';
            
            aladin.setImageSurvey(surveys[currentLayer]);
            aladin.gotoRaDec(83.82, -5.39); // Orion
            aladin.setFov(60);
            
            document.querySelectorAll('.space-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            showInfo('Перемкнуто на зоряне небо');
        }
        
        function switchToMars() {
            if (!aladin) return;
            currentMode = 'mars';
            document.getElementById('currentMode').textContent = 'Марс';
            document.getElementById('formLocation').textContent = 'Марс';
            
            aladin.setImageSurvey(surveys.mars);
            aladin.gotoRaDec(226.2, 18.65); // Olympus Mons
            aladin.setFov(180);
            
            // Add Mars features
            addMarsFeatures();
            
            document.querySelectorAll('.space-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            showInfo('Перемкнуто на Марс - дослідіть червону планету!');
        }
        
        function switchToMoon() {
            if (!aladin) return;
            currentMode = 'moon';
            document.getElementById('currentMode').textContent = 'Місяць';
            document.getElementById('formLocation').textContent = 'Місяць';
            
            aladin.setImageSurvey(surveys.moon);
            aladin.gotoRaDec(0, 0);
            aladin.setFov(180);
            
            document.querySelectorAll('.space-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            showInfo('Перемкнуто на Місяць');
        }
        
        function switchLayer(layer) {
            if (!aladin || currentMode !== 'sky') return;
            currentLayer = layer;
            aladin.setImageSurvey(surveys[layer]);
            
            document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const layerNames = {
                optical: 'оптичний',
                infrared: 'інфрачервоний',
                xray: 'рентгенівський'
            };
            showInfo(`Шар змінено на ${layerNames[layer]}`);
        }
        
        function addMarsFeatures() {
            const c = document.createElement('canvas');
            c.width = c.height = 11;
            const ctx = c.getContext('2d');
            ctx.beginPath();
            ctx.arc(5, 5, 4, 0, 2 * Math.PI, false);
            ctx.closePath();
            ctx.strokeStyle = '#FFAA00';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            const geoFeatures = A.catalog({
                shape: c,
                labelColumn: 'name',
                displayLabel: true,
                labelColor: '#FFAA00',
                labelFont: '14px sans-serif'
            });
            aladin.addCatalog(geoFeatures);
            
            marsLocations.forEach(loc => {
                geoFeatures.addSources(A.source(loc.ra, loc.dec, {name: loc.name}));
            });
        }
        
        function startTour() {
            if (tourInterval) {
                stopTour();
                return;
            }
            
            document.getElementById('gameMode').style.display = 'block';
            document.getElementById('gameMode').textContent = '🎮 Космічний тур активний';
            
            const targets = currentMode === 'mars' ? marsLocations : skyObjects;
            
            tourInterval = setInterval(() => {
                const target = targets[tourIndex];
                
                if (currentMode === 'mars') {
                    aladin.animateToRaDec(target.ra, target.dec, 5);
                    showInfo(`Летимо до ${target.name}`);
                } else {
                    aladin.animateToTarget(target.target, 5);
                    showInfo(`Летимо до ${target.name}`);
                }
                
                tourIndex = (tourIndex + 1) % targets.length;
            }, 8000);
            
            showInfo('Космічний тур розпочато! Натисніть ще раз, щоб зупинити');
        }
        
        function stopTour() {
            if (tourInterval) {
                clearInterval(tourInterval);
                tourInterval = null;
                document.getElementById('gameMode').style.display = 'none';
                showInfo('Тур завершено');
            }
        }
        
        function openMarkerForm() {
            document.getElementById('markerForm').classList.add('active');
            document.getElementById('markerName').focus();
            document.getElementById('coordRA').textContent = currentCoords.ra.toFixed(2);
            document.getElementById('coordDec').textContent = currentCoords.dec.toFixed(2);
        }
        
        function closeMarkerForm() {
            document.getElementById('markerForm').classList.remove('active');
            document.getElementById('markerName').value = '';
            document.getElementById('markerDetails').value = '';
        }
        
        function addMarker() {
            const name = document.getElementById('markerName').value.trim();
            if (!name) return;
            
            const marker = {
                id: crypto.randomUUID(),
                ra: currentCoords.ra,
                dec: currentCoords.dec,
                author: userName,
                authorId: userId,
                text: name,
                color: selectedColor,
                details: document.getElementById('markerDetails').value,
                mode: currentMode,
                timestamp: Date.now()
            };
            
            // Save locally
            markers.push(marker);
            localStorage.setItem('markers', JSON.stringify(markers));
            updateMarkerCount();
            updateMarkersList();
            
            // Add to map
            renderMarkerOnMap(marker);
            
            // Send to server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'addMarker', marker }));
            }
            
            closeMarkerForm();
            showInfo(`Маркер "${name}" додано!`);
        }
        
        function renderMarkerOnMap(marker) {
            if (!aladin) return;
            
            const cat = A.catalog({
                name: `Маркер від ${marker.author}`,
                sourceSize: 20,
                color: marker.color
            });
            
            aladin.addCatalog(cat);
            
            cat.addSources([
                A.marker(marker.ra, marker.dec, {
                    popupTitle: `${marker.author}: ${marker.text}`,
                    popupDesc: `${marker.details || ''}<br><small>Режим: ${marker.mode || 'небо'}</small>`,
                    data: { markerId: marker.id }
                })
            ]);
        }
        
        function handleMarkerClick(markerId) {
            const marker = allPlayersMarkers.find(m => m.id === markerId);
            if (marker && marker.authorId !== userId) {
                // Collect marker from other player
                if (!markers.find(m => m.id === marker.id)) {
                    markers.push(marker);
                    localStorage.setItem('markers', JSON.stringify(markers));
                    updateMarkerCount();
                    updateMarkersList();
                    showInfo(`Ви зібрали маркер від ${marker.author}: ${marker.text}`);
                } else {
                    showInfo('Ви вже зібрали цей маркер');
                }
            } else if (marker && marker.authorId === userId) {
                // Go to own marker
                aladin.animateToRaDec(marker.ra, marker.dec, 2);
            }
        }
        
        function loadMarkers() {
            markers.forEach(marker => renderMarkerOnMap(marker));
            updateMarkersList();
        }
        
        function updateMarkerCount() {
            document.getElementById('markerCount').textContent = markers.length;
        }
        
        function updateMarkersList() {
            const list = document.getElementById('markersList');
            list.innerHTML = '';
            
            markers.slice(-15).forEach(marker => {
                const item = document.createElement('div');
                item.className = 'marker-item';
                item.style.backgroundColor = marker.color + '33';
                item.style.borderColor = marker.color;
                item.textContent = marker.text;
                item.title = `Клацніть, щоб полетіти до маркера`;
                item.onclick = () => {
                    aladin.animateToRaDec(marker.ra, marker.dec, 2);
                    showInfo(`Летимо до "${marker.text}"`);
                };
                list.appendChild(item);
            });
        }
        
        function showInfo(message) {
            const info = document.getElementById('infoMessage');
            info.textContent = message;
            info.classList.add('active');
            setTimeout(() => {
                info.classList.remove('active');
            }, 3000);
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/ws?userId=${userId}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                ws.send(JSON.stringify({ type: 'getAllMarkers' }));
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'newMarker' && data.marker.authorId !== userId) {
                    allPlayersMarkers.push(data.marker);
                    renderMarkerOnMap(data.marker);
                    showInfo(`🆕 Новий маркер від ${data.marker.author}!`);
                } else if (data.type === 'allMarkers') {
                    allPlayersMarkers = data.markers;
                    data.markers.forEach(marker => {
                        if (marker.authorId !== userId) {
                            renderMarkerOnMap(marker);
                        }
                    });
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed');
                setTimeout(connectWebSocket, 3000);
            };
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') switchToSky();
            if (e.key === '2') switchToMars();
            if (e.key === '3') switchToMoon();
            if (e.key === ' ' && !document.getElementById('markerForm').classList.contains('active')) {
                e.preventDefault();
                startTour();
            }
            if (e.key === 'Escape') {
                closeMarkerForm();
                stopTour();
            }
        });
        
        // Start
        window.onload = init;
    </script>
</body>
</html>
